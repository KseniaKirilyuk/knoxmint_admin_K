version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: knoxmint-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: knoxmint
      POSTGRES_PASSWORD: knoxmint_secret
      POSTGRES_DB: knoxmint
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knoxmint"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: knoxmint-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://knoxmint:knoxmint_secret@db:5432/knoxmint
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

  # Frontend (for development - in production, use nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: knoxmint-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://backend:3001

volumes:
  postgres_data:
